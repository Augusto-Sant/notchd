[package]
name = "notchd-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "notchd's providers: facts per OS behind traits."

[dependencies]
notchd-proto = { path = "../notchd-proto" }
notchd-core = { path = "../notchd-core" }
serde.workspace = true
serde_json.workspace = true

portable-pty = "0.9.0"
libc = "0.2.191"

# MPRIS over D-Bus. zbus with its default features (the async-io reactor and
# the blocking API): pure Rust, no libdbus to link, used from threads of its
# own. It is the crate the architecture doc names.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"
