[package]
name = "notchd-daemon"
version = "0.5.0"
edition.workspace = true
license.workspace = true
description = "The notchd daemon and CLI."

[dependencies]
notchd-proto = { path = "../notchd-proto" }
notchd-core = { path = "../notchd-core" }
notchd-modules = { path = "../notchd-modules" }
notchd-providers = { path = "../notchd-providers" }
serde.workspace = true
serde_json.workspace = true
libc = "0.2.191"
# Experimental: the grid view of a terminal (src/grid.rs). Builds Ghostty's
# libghostty-vt from source, which needs zig 0.15.2 on PATH.
libghostty-vt = { version = "0.2.2", optional = true }
# The kitty images: PNGs the programs send decoded, and what the view draws
# encoded (the grid view; the ghostty feature).
png = { version = "0.18.1", optional = true }

[features]
ghostty = ["dep:libghostty-vt", "dep:png"]

[lib]
name = "notchd_daemon"
path = "src/lib.rs"

[[bin]]
name = "notchd"
path = "src/main.rs"

[dev-dependencies]
notchd-testkit = { path = "../notchd-testkit" }
